---
version: 5
defaults:
  datadir: data
  lookup_key: eyaml_lookup_key
  options:
    pkcs7_private_key: /etc/puppetlabs/puppet/keys/private_key.pkcs7.pem
    pkcs7_public_key: /etc/puppetlabs/puppet/keys/public_key.pkcs7.pem

hierarchy:
  - name: "ServiceNow Hiera data"
    data_hash: servicenow_cmdb_integration::getvar
    options:
      var: trusted.external.servicenow.hiera_data
  - name: 'Environment data'
    paths:
      - 'nodes/%{facts.networking.fqdn}.yaml'
      - 'location/%{facts.location}/%{facts.role}.yaml'
      - 'role/%{facts.tier}/%{facts.role}.yaml'
      - 'role/%{facts.role}.yaml'
      - 'location/%{facts.location}.yaml'
      - 'os/%{facts.os.name}.yaml'
      - 'cem/%{facts.os.name}/%{facts.os.release.major}.yaml'
      - 'cem/cem_defaults.yaml'      
      - 'common.yaml'
  - name: 'Local data'
    paths:
      - '/etc/puppetlabs/puppet/local.yaml'
